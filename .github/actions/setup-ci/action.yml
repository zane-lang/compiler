name: Set up CI toolchain
description: The pixi environment and its opam switch, restored from cache, for an isolated CI job.
inputs:
  grammar-dependencies:
    description: Install Node and Python dependencies for grammar generation.
    default: 'false'
runs:
  using: composite
  steps:
    # The environment pixi.lock pins (pixi.toml): OCaml, LLVM, clang, LLD,
    # zig, just, Python, Node and the rest. Windows takes MSVC from the
    # newest Visual Studio through the activation (dev/setup/activate.bat).
    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        run-install: true
        locked: true
        cache: true

    # The opam switch is most of a cold setup: dune, menhir, sedlex, uucp
    # and uuseg are built from source. Once restored, `pixi run setup` finds
    # every package at its pinned version and installs nothing. The key
    # covers everything the switch is built from: the environment and the
    # pins.
    - name: Restore the opam switch
      id: opam
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _opam
          .pixi/opam
        key: opam-pixi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain', 'dev/setup/opam-repo/**') }}

    # Its own step, so a toolchain failure is not reported as a build failure.
    - name: Install OCaml dependencies
      shell: bash
      run: pixi run setup

    # Saved as soon as setup succeeds, since a later step may fail.
    - name: Save the opam switch
      if: steps.opam.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          _opam
          .pixi/opam
        key: ${{ steps.opam.outputs.cache-primary-key }}

    - name: Cache grammar generator downloads
      if: inputs.grammar-dependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('editors/tree-sitter-zane/package-lock.json') }}

    # The highlighting requirements include the generator's own.
    - name: Install grammar generator dependencies
      if: inputs.grammar-dependencies == 'true'
      shell: bash
      run: |
        pixi run .github/scripts/setup-grammar-dependencies
        python=$PWD/.grammar-venv/bin/python
        [[ -x .grammar-venv/Scripts/python.exe ]] && python=$PWD/.grammar-venv/Scripts/python.exe
        echo "GRAMMAR_PYTHON=$python" >> "$GITHUB_ENV"
