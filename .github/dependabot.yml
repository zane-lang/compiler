# Every workflow pins its actions by commit, one version per action. This
# keeps those pins current, all of them in one pull request, so the
# workflows never drift onto different versions of one action.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-ci
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /editors/tree-sitter-zane
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /tools/grammar
      - /tests/highlighting
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
