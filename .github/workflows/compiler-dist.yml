name: Compiler distribution

on:
  pull_request:
    paths:
      - ".github/workflows/compiler-dist.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/release-tag"
      - ".github/scripts/install-zig"
      - ".github/scripts/zig-archive.py"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/actions/setup-ci/**"
      - "dev/release/**"
      - "dev/toolchains/**"
      - "tests/release/**"
      - "tests/codegen/fixtures/hello/**"
      - "tests/codegen/golden/hello.out"
      - "dev/setup/**"
      - ".gitmodules"
      - "vendor/**"
      - "bin/**"
      - "lib/**"
      - "runtime/**"
      - "dune-project"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the test archives
        type: string
        required: false
        default: v0.0

permissions:
  contents: read

concurrency:
  group: compiler-dist-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs at once: the safeguards, the compiler's tests, and each
# platform's package, built, packaged and checked on that platform by the same
# steps. A release publishes only when every job here has passed.
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release safeguards
        run: |
          bash tests/release/tag.sh
          python3 -m unittest discover -s tests/release -p '*_test.py' -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false
      - name: Set up compiler toolchain
        uses: ./.github/actions/setup-ci
      - name: Test compiler
        run: pixi run just test-compiler

  package:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            os: linux
            zig: x86_64-linux
          - platform: macos-aarch64
            runner: macos-latest
            os: macos
            zig: aarch64-macos
          - platform: macos-x86_64
            runner: macos-15-intel
            os: macos
            zig: x86_64-macos
          - platform: windows-x86_64
            runner: windows-latest
            os: windows
            zig: x86_64-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version || 'v0.0' }}
      ZIG_MANIFEST: dev/toolchains/zig-${{ matrix.zig }}.json
      ARCHIVE: dist/zane-compiler-${{ inputs.version || 'v0.0' }}-${{ matrix.platform }}.tar.gz
    steps:
      # The checkout keeps each file's own line endings: a batch file's CRLF,
      # every other's LF (.gitattributes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false
      - name: Set up compiler toolchain
        uses: ./.github/actions/setup-ci
      - name: Install verified Zig
        run: .github/scripts/install-zig "$ZIG_MANIFEST"
      - name: Build compiler and package toolchain
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          pixi run dune build bin/zanec/zanec.exe
          pixi run python dev/release/package-${{ matrix.os }}.py \
            --binary _build/default/bin/zanec/zanec.exe --zig "$ZIG" \
            --zig-manifest "$ZIG_MANIFEST" --version "$VERSION" \
            --commit "$SOURCE_SHA" --output dist
      # Neither the pixi environment nor the opam switch is used, so an
      # accidental dependency on the build machine fails here. On Linux the
      # check runs in a bare container, which keeps the machine's loader,
      # LLVM and C toolchain from it as well.
      - name: Check the extracted archive
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm --network none \
              -v "$PWD:/source:ro" -v "$RUNNER_TEMP/check:/output" \
              ubuntu:22.04 bash /source/dev/release/check-archive "/source/$ARCHIVE" /output /source
          else
            dev/release/check-archive "$ARCHIVE" "$RUNNER_TEMP/check" "$PWD"
          fi
      - name: Keep the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
