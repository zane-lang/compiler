name: Compiler distribution

on:
  pull_request:
    paths:
      - ".github/workflows/compiler-dist.yml"
      - ".github/workflows/release.yml"
      - ".github/scripts/release-tag"
      - ".github/scripts/install-zig"
      - ".github/actions/setup-ci/**"
      - "dev/release/**"
      - "dev/toolchains/**"
      - ".github/scripts/install-zig-macos"
      - "tests/release/**"
      - "tests/codegen/fixtures/hello/**"
      - "tests/codegen/golden/hello.out"
      - "dev/bin/check-programs"
      - "dev/setup/bootstrap-toolchain"
      - "devbox.*"
      - "bin/**"
      - "lib/**"
      - "runtime/**"
      - "dune-project"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the test archives
        type: string
        required: false
        default: v0.0

permissions:
  contents: read

concurrency:
  group: compiler-dist-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job that needs nothing from another runs at once: the safeguards,
# the compiler's tests and the package, whose programs then run on Windows
# and macOS. A release publishes only when every job here has passed.
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release safeguards
        run: |
          bash tests/release/tag.sh
          python3 -m unittest discover -s tests/release -p '*_test.py' -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false
      - name: Set up compiler toolchain
        uses: ./.github/actions/setup-ci
      - name: Test compiler
        run: devbox run -- just test-compiler

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version || 'v0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false
      - name: Set up compiler toolchain
        uses: ./.github/actions/setup-ci
      - name: Install verified Zig
        run: .github/scripts/install-zig
      - name: Package compiler and runtime libraries
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          devbox run -- dune build bin/zanec/zanec.exe
          devbox run -- python3 dev/release/package-linux.py \
            --binary _build/default/bin/zanec/zanec.exe --zig "$ZIG" \
            --version "$VERSION" --commit "$SOURCE_SHA" --output dist
      # Neither /nix nor the opam switch is mounted. This catches accidental
      # dependencies on the build machine's loader, LLVM and C toolchain.
      - name: Test extracted archive without the development environment
        run: |
          mkdir -p "$RUNNER_TEMP/release-smoke"
          docker run --rm --network none \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/release-smoke:/output" \
            ubuntu:22.04 bash /source/dev/release/smoke-linux \
            "/source/dist/zane-compiler-$VERSION-linux-x86_64.tar.gz" /output
          mkdir -p windows-smoke
          cp "$RUNNER_TEMP/release-smoke"/*.exe "$RUNNER_TEMP/release-smoke"/*.dll windows-smoke/
          for name in plain optimized tiered; do
            cp tests/codegen/golden/hello.out "windows-smoke/hello-$name.out"
            echo 0 > "windows-smoke/hello-$name.status"
          done
          for arch in x86_64 aarch64; do
            mkdir -p "macos-smoke/$arch"
            for name in plain optimized tiered; do
              cp "$RUNNER_TEMP/release-smoke/macos/hello-$arch-$name" "macos-smoke/$arch/hello-$name"
              cp tests/codegen/golden/hello.out "macos-smoke/$arch/hello-$name.out"
              echo 0 > "macos-smoke/$arch/hello-$name.status"
            done
            cp "$RUNNER_TEMP/release-smoke/macos/hello-$arch-tiered.tier1.dylib" "macos-smoke/$arch/hello-tiered.tier1.dylib"
          done
      - name: Keep distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Keep programs linked by the released toolchain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-windows-smoke
          path: windows-smoke
          if-no-files-found: error
      - name: Keep macOS programs linked by the released toolchain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-macos-smoke
          path: macos-smoke
          if-no-files-found: error

  macos-compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || 'v0.0' }}
      ZIG_MANIFEST: dev/toolchains/zig-${{ matrix.arch }}-macos.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install Nix for macOS
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: Set up compiler toolchain
        if: matrix.arch == 'aarch64'
        uses: ./.github/actions/setup-ci
        with:
          skip-nix-installation: 'true'
      - name: Install Intel Devbox toolchain
        if: matrix.arch == 'x86_64'
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          project-path: .github/devbox-intel
          enable-cache: true
          skip-nix-installation: 'true'
      - name: Set up Intel compiler toolchain
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          apple_clang="$(xcrun --find clang)"
          apple_clang_headers="$("$apple_clang" -print-resource-dir)/include"
          export CPATH="$apple_clang_headers${CPATH:+:$CPATH}"
          devbox run --config=.github/devbox-intel -- \
            env ZANE_CC="$GITHUB_WORKSPACE/dev/bin/clang-lld" \
                LLVM_CONFIG=llvm-config \
                CPATH="$CPATH" \
                "$GITHUB_WORKSPACE/dev/setup/bootstrap-toolchain"
      - name: Install verified native Zig
        run: .github/scripts/install-zig-macos "$ZIG_MANIFEST"
      - name: Build compiler and package macOS toolchain
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            devbox run --config=.github/devbox-intel -- \
              env ZANE_CC="$GITHUB_WORKSPACE/dev/bin/clang-lld" \
                  LLVM_CONFIG=llvm-config \
                bash "$GITHUB_WORKSPACE/.github/scripts/build-macos-compiler"
          else
            devbox run -- dune build bin/zanec/zanec.exe
            devbox run -- python3 dev/release/package-macos.py \
              --binary _build/default/bin/zanec/zanec.exe --zig "$ZIG" \
              --zig-manifest "$ZIG_MANIFEST" --version "$VERSION" \
              --commit "$SOURCE_SHA" --output dist
          fi
      - name: Smoke-test extracted macOS toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/macos-smoke"
          tar -xzf "dist/zane-compiler-$VERSION-macos-${{ matrix.arch }}.tar.gz" \
            -C "$RUNNER_TEMP/macos-smoke"
          root="$RUNNER_TEMP/macos-smoke/zane-compiler-$VERSION-macos-${{ matrix.arch }}"
          cp -R tests/codegen/fixtures/hello "$RUNNER_TEMP/hello"
          "$root/bin/zanec" --build "$RUNNER_TEMP/hello-program" \
            --package "$RUNNER_TEMP/hello"
          "$RUNNER_TEMP/hello-program" > "$RUNNER_TEMP/hello.out"
          cmp tests/codegen/golden/hello.out "$RUNNER_TEMP/hello.out"
      - name: Keep macOS compiler archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-windows-smoke
          path: windows-smoke
      - name: Run cross-compiled programs on Windows
        shell: bash
        run: dev/bin/check-programs windows-smoke

  macos:
    needs: linux
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiler-macos-smoke
          path: macos-smoke
      - name: Run cross-compiled programs on macOS
        run: |
          chmod +x macos-smoke/${{ matrix.arch }}/hello-plain macos-smoke/${{ matrix.arch }}/hello-optimized macos-smoke/${{ matrix.arch }}/hello-tiered
          dev/bin/check-programs macos-smoke/${{ matrix.arch }}
