name: Research CI and pair hash probe

# Temporary research-branch checks and bounded throughput comparison for cached pair-table hashing.
# Keep the proof's derived pair cap equal to historical run #125 so pair count
# and peak RSS are comparable; the engine clock is intentionally shorter.
on:
  push:
    branches:
      - research/ambiguity-proof-2026-09-23

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # The proof derives its single-walker cap from 6 GiB / 840 bytes per
      # pair, independently of JOBS: this reproduces #125's 6,902,626 cap.
      AMBIGUITY_MEMORY_MB: "6144"
      AMBIGUITY_MAX_FRONTIER_RATIO: "1.0"
      AMBIGUITY_JOBS: "4"
      AMBIGUITY_MENHIR: menhir
      REPORT: reports/ambiguity/actions/pairhash-${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: Check out research revision
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Sanity check
        run: devbox list

      - name: Install OCaml dependencies
        run: devbox run -- dev/bin/bootstrap-toolchain

      - name: Build
        run: devbox run -- just rebuild

      - name: Parser and ambiguity tests
        run: devbox run -- just test

      - name: Run bounded full-grammar CEGAR probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$REPORT")"
          set +e
          /usr/bin/time -v timeout --signal=TERM --kill-after=10s 15m \
            devbox run -- dev/bin/ambiguity __engine \
              --max-tokens 0 --min-tokens 0 --timeout 840 \
              --max-witnesses 1 --prove 1 --prove-cegar 3 --prove-refine 4 \
            2>&1 | tee "$REPORT"
          status=${PIPESTATUS[0]}
          printf '\nProbe process exit status: %s\n' "$status" | tee -a "$REPORT"
          if [[ "$status" -eq 3 ]] && grep -q '^NOT PROVEN:' "$REPORT"; then
            echo "Probe verdict: expected NOT PROVEN (bounded full-grammar search)." | tee -a "$REPORT"
          elif [[ "$status" -ne 0 ]]; then
            echo "Probe verdict: unexpected process failure." | tee -a "$REPORT"
            exit "$status"
          else
            echo "Probe verdict: completed without the expected NOT PROVEN result." | tee -a "$REPORT"
            exit 1
          fi

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ambiguity-pairhash-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ambiguity/actions/
          if-no-files-found: warn
          retention-days: 30
