name: Ambiguity search

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to search
        required: true
        default: main
        type: string
      profile:
        description: Search profile
        required: true
        default: general
        type: choice
        options:
          - quick
          - general
          - deep-function-body
      tokens:
        description: Optional token range override, for example 0..30
        required: false
        type: string
      timeout:
        # The job is hard-stopped after 45 minutes, and checkout, the pixi environment, the
        # opam bootstrap, the build and the report upload all come out of that
        # budget. The offered values leave room for a cold setup, so a search
        # is never killed before it can emit its report.
        description: Search timeout
        required: true
        default: 30m
        type: choice
        options:
          - 5m
          - 15m
          - 30m
      witnesses:
        description: Maximum witnesses
        required: true
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: ambiguity-${{ inputs.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  search:
    name: ${{ inputs.profile }} on ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public ubuntu-latest runners provide four CPUs and 16 GB RAM:
      # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      # Give the four search workers 10 GiB total, leaving about 6 GiB for the
      # runner, coordinator, native allocations, and compaction/COW peaks.
      AMBIGUITY_MEMORY_MB: "10240"
      AMBIGUITY_MAX_FRONTIER_RATIO: "1.0"
      AMBIGUITY_JOBS: "4"
      AMBIGUITY_MENHIR: menhir
      REPORT: reports/ambiguity/actions/${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}.txt

    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci

      - name: Build ambiguity finder
        shell: bash
        run: |
          set -euo pipefail
          pixi run dune build tools/ambiguity/engine/ambiguity_search.exe

      - name: Run ambiguity search
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          TOKENS: ${{ inputs.tokens }}
          SEARCH_TIMEOUT: ${{ inputs.timeout }}
          WITNESSES: ${{ inputs.witnesses }}
        run: |
          set -euo pipefail
          pixi run .github/scripts/ambiguity-search

      - name: Show report in job log
        if: always()
        shell: bash
        run: |
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT"
          else
            echo "No report was produced."
          fi

      - name: Upload ambiguity report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ambiguity-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ambiguity/actions/
          if-no-files-found: warn
          retention-days: 30
