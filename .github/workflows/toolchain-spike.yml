name: Toolchain spike

# Exploratory: can one pixi (conda-forge) environment build and test zanec
# natively on Linux, both macOS architectures and Windows? Each stage is its
# own step, so a run shows how far each platform gets.
on:
  push:
    branches: [claude/inspiring-euler-ztn4zi]
    paths:
      - pixi.toml
      - dev/spike/**
      - .github/workflows/toolchain-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x86_64, runner: windows-latest }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # opam's conf-msvc64 must find Visual Studio; give it the developer
      # environment it falls back on.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: true
          locked: false
          cache: false
      - name: Toolchain versions
        run: pixi run bash dev/spike/toolchain versions
      - name: opam on the conda OCaml
        run: pixi run bash dev/spike/toolchain opam
      - name: opam pins (dune, menhir, sedlex, uucp, uuseg)
        run: pixi run bash dev/spike/toolchain pins
      - name: Build zanec
        run: pixi run bash dev/spike/toolchain build
      - name: Build and run hello
        run: pixi run bash dev/spike/toolchain hello
      - name: just test-compiler
        run: pixi run bash dev/spike/toolchain test
