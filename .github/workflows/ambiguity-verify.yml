name: Grammar verification

# `just verify-grammar` runs the Lean checker in formal/, whose theorems state
# that the parse relation lib/cst/parser.mly defines is unambiguous and that the
# GLR parser's relation is unambiguous and maps onto it
# (docs/ambiguity/formal-proof.md).
#
# This is a gate. The grammar is proven today, so a red run means a change made
# it ambiguous, or moved it outside what the checker can certify; either way
# the change needs a look before it merges. `ambiguity search` finds a concrete
# ambiguous input when it is the former.
#
# The job runs on every pull request, so it can be a required check: one that
# never started would hold a merge forever. A pull request that touches
# neither the grammar nor the proofs passes it at once, after
# `.github/scripts/ci-suites` says so.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # `.github/scripts/ci-suites` lists a pull request's changed files.
  pull-requests: read

concurrency:
  group: ambiguity-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false

      - name: Decide whether the proofs need to run
        id: suites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-suites

      # The same toolchain `ci.yml` builds with; Menhir is the only part used.
      - name: Set up toolchain
        if: steps.suites.outputs.formal == 'true'
        uses: ./.github/actions/setup-ci

      # elan's own toolchains, which run on the bare runner, outside the pixi
      # environment.
      - name: Restore the Lean build
        if: steps.suites.outputs.formal == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan/toolchains
            formal/.lake
          key: lean-elan-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/**/*.lean', 'formal/lakefile.toml') }}
          restore-keys: lean-elan-${{ runner.os }}-

      # elan, Lean's own installer, which conda-forge does not package;
      # formal/lean-toolchain selects the proof checker, and a restored
      # toolchain makes installing it a no-op.
      - name: Install Lean
        if: steps.suites.outputs.formal == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"

      # The report binds the verdict to the exact source and tool versions.
      - name: Verify the grammar
        if: steps.suites.outputs.formal == 'true'
        run: |
          set -o pipefail
          {
            echo "parser.mly sha256: $(sha256sum lib/cst/parser.mly | cut -d' ' -f1)"
            echo "commit: $GITHUB_SHA"
            echo "lean: $(cat formal/lean-toolchain)"
            echo "menhir: $(pixi run menhir --version)"
          } > verify-grammar.txt
          pixi run just verify-grammar 2>&1 | tee -a verify-grammar.txt

      - name: Keep the report
        if: always() && steps.suites.outputs.formal == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-grammar
          path: verify-grammar.txt
