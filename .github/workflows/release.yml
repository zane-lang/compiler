name: Release compiler

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Compiler version (vMAJOR.MINOR, for example v0.1)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: compiler-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$RELEASE_REF" = "refs/heads/$DEFAULT_BRANCH"
      - name: Validate version and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/scripts/release-tag check

  build:
    needs: prepare
    uses: ./.github/workflows/compiler-dist.yml
    with:
      version: ${{ inputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiler-linux-x86_64
          path: dist
      - name: Check assets and calculate checksums
        run: |
          test -f "dist/zane-compiler-$VERSION-linux-x86_64.tar.gz"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Tag the tested commit and publish
        run: |
          bash .github/scripts/release-tag create
          gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" \
            --generate-notes --draft
          gh release edit "$VERSION" --draft=false --latest
