name: Perf

# The perf programs' estimated cycles, optimized and plain
# (tests/perf/README.md), checked against main's rows on the `perf-log`
# branch in the merge queue: a merge group fails when a build is more than
# the tolerance slower than its row, unless the last pull request queued in
# it is labelled `perf-accepted`, which passes it with a warning. A manual
# run measures and compares. perf-record.yml writes the branch on each push
# to main.
#
# On a pull request the job skips itself, which counts as passing for the
# required check, so the pull request can enter the queue; the queue measures
# the commit main will become.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Measure and compare, with a read-only token, since a pull request's own
  # code runs here. It reads the `perf-log` branch with that token.
  perf:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reading the labels of a pull request in the merge queue.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci

      - name: Build
        run: pixi run dune build bin/zanec/zanec.exe

      # A merge group's event carries no labels; its head ref names the last
      # pull request queued in it, gh-readonly-queue/<base>/pr-<number>-<sha>.
      - name: Read the queued pull request's labels
        if: github.event_name == 'merge_group'
        id: queued
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
          test -n "$number"
          accepted=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
            --jq 'any(.labels[]; .name == "perf-accepted")')
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"

      - name: Measure
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACCEPTED: ${{ github.event_name == 'merge_group' && steps.queued.outputs.accepted || 'false' }}
        run: pixi run .github/scripts/perf
