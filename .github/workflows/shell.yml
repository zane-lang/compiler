name: Shell

# A command prompt on a runner that already has the toolchain. Most of what
# this repository's development needs — `dune build`, `just test`, `menhir
# --explain`, the ambiguity tools — only works inside the pixi environment,
# and provisioning it is the slow part of reproducing a failure. This runs one
# command in that environment and hands back the output, which is faster than
# adding a throwaway workflow every time a question comes up.
#
# It is deliberately not wired to anything but a manual dispatch: no schedule,
# no pull request trigger, no `repository_dispatch`. The only way it runs is
# somebody choosing to run it.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Command to run
        required: true
        default: just test
        type: string
      ref:
        description: Branch, tag, or commit to run it against
        required: true
        default: main
        type: string
      toolchain:
        # Off is worth having: a command that needs no toolchain is done
        # sooner on the bare runner.
        description: Run inside the pixi environment (needed for the OCaml toolchain)
        required: true
        default: true
        type: boolean
      timeout:
        description: Minutes before the run is killed
        required: true
        default: "30"
        type: string
      runner:
        # macos-latest is AArch64 (Apple silicon), the one other system
        # pixi.toml's environment solves for that hosted runners offer.
        description: The runner to run it on (ubuntu-latest, macos-latest, windows-latest, ...)
        required: true
        default: ubuntu-latest
        type: string

# The token this job carries is read-only. A command that runs here can read
# it, so there is nothing to be gained by granting it more: anything that has
# to write to the repository should be a workflow that says what it writes.
permissions:
  contents: read

# One at a time, and never cancelled. A queued command is a command somebody is
# waiting on, and a half-executed one is worse than a slow one.
concurrency:
  group: shell
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}

    steps:
      # What actually gates this job is GitHub's own rule that only accounts
      # with write access can dispatch a workflow. That is a platform
      # guarantee and it holds whether or not this step runs.
      #
      # The step is a second opinion for the case the rule does not describe:
      # a token or an app dispatching on somebody's behalf. It is advisory,
      # and deliberately so. The collaborator-permission endpoint wants push
      # access to answer, and the token this job carries is read-only, so on
      # most runs it will decline to say - and raising the token's access just
      # to ask whether the actor has access would give away more than the
      # check is worth. A definitive "no" stops the run; anything else says
      # so and leaves the platform rule to do its job.
      - name: Check the actor can write to this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -uo pipefail
          permission=$(gh api \
            "repos/$REPOSITORY/collaborators/$ACTOR/permission" \
            --jq .permission 2>/dev/null)
          case "$permission" in
            admin|maintain|write)
              echo "$ACTOR has $permission access."
              ;;
            "")
              echo "Could not read $ACTOR's permission with this job's" \
                "read-only token; relying on GitHub restricting" \
                "workflow_dispatch to accounts with write access."
              ;;
            *)
              echo "::error::$ACTOR does not have write access ($permission)"
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          ref: ${{ inputs.ref }}

      - name: Set up toolchain
        if: ${{ inputs.toolchain }}
        uses: ./.github/actions/setup-ci

      # The environment's activation is taken into this step's shell, so the
      # command keeps its shell syntax: pipelines, redirects and quoting all
      # survive.
      - name: Run
        if: ${{ inputs.toolchain && runner.os != 'macOS' }}
        env:
          COMMAND: ${{ inputs.command }}
        shell: bash
        run: |
          eval "$(pixi shell-hook)"
          bash -c "$COMMAND"

      # macOS's bash 3.2 cannot read the environment's bash completions,
      # which the shell hook sources, so the activation comes from `pixi
      # run` instead and the command still runs in bash.
      - name: Run (macOS)
        if: ${{ inputs.toolchain && runner.os == 'macOS' }}
        env:
          COMMAND: ${{ inputs.command }}
        shell: bash
        run: pixi run -- bash -c "$COMMAND"

      - name: Run (no toolchain)
        if: ${{ !inputs.toolchain }}
        env:
          COMMAND: ${{ inputs.command }}
        shell: bash
        run: bash -lc "$COMMAND"
