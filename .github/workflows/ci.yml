name: CI

# A pull request is where these checks are wanted, so they run there as well as
# in the merge queue. `workflow_dispatch` allows a re-run against any branch
# without opening a pull request.
#
# The push to main is what makes the caches below useful. GitHub lets a pull
# request read caches saved on its own branch or on the default branch, and on
# no other, so while CI ran only on pull requests every one of them started
# cold. A run on main saves a cache every pull request can restore.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # `.github/scripts/ci-suites` lists a pull request's changed files.
  pull-requests: read

# Superseded pull request runs are cancelled; a merge queue run is not, since
# the queue is waiting on its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The grammar and ambiguity-tool suites only answer something new when
      # the grammar or the tools change, so a pull request that touches
      # neither skips them. The merge queue and main run everything.
      - name: Decide which suites to run
        id: suites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-suites

      # The opam switch is most of a cold setup: dune, menhir and sedlex are
      # built from source. It is restored before devbox starts because the
      # devbox init hook runs `bootstrap-toolchain`, which finds a warm switch
      # already at its pins and installs nothing.
      #
      # The key covers everything the switch is built from: the system OCaml
      # devbox provides, and the pins. It is hashed from the committed files,
      # before devbox has had a chance to rewrite its lock.
      - name: Restore the opam switch
        uses: actions/cache@v6
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devbox.json', 'devbox.lock', 'dev/bin/bootstrap-toolchain') }}

      - name: Install devbox + Nix + devbox.json packages
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Sanity check
        run: devbox list

      # Codegen builds its module through LLVM's OCaml bindings, which wrap
      # LLVM 19 (dev/bin/bootstrap-toolchain). The runner's apt has it, and
      # the bindings find it as `llvm-config-19` before any other.
      - name: Install LLVM 19
        run: sudo apt-get update && sudo apt-get install -y llvm-19-dev libzstd-dev

      # The init hook bootstraps the opam switch, but doing it as its own step
      # keeps a toolchain failure from being reported as a build failure.
      #
      # Every command below is a single word followed by plain arguments:
      # `devbox run` quotes each argument and `eval`s the result, so a shell
      # snippet passed this way would be mangled rather than run.
      - name: Install OCaml dependencies
        run: devbox run -- dev/bin/bootstrap-toolchain

      - name: Build
        run: devbox run -- just rebuild

      - name: Grammar generator tests
        run: devbox run -- just test-grammar-generation

      # The golden expectations under tests/ and parser acceptance. Every
      # change runs these. The recipes fail loudly when Menhir is missing
      # rather than reporting a green run that skipped them.
      - name: Compiler tests
        run: devbox run -- just test-compiler

      # The test programs built for Windows, which the `windows` job below
      # runs there (docs/design/platforms.md). Zig links them; it comes from
      # its release, checked against the release's digest.
      - name: Install Zig
        run: .github/scripts/install-zig

      - name: Build the Windows programs
        run: devbox run -- dev/bin/windows-programs windows-programs

      - name: Keep the Windows programs
        uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          path: windows-programs
          if-no-files-found: error

      - name: Grammar ambiguity tests
        if: steps.suites.outputs.grammar == 'true'
        run: devbox run -- just test-grammar

      - name: Ambiguity tool tests
        if: steps.suites.outputs.ambiguity-tools == 'true'
        run: devbox run -- just test-ambiguity-tools

  # Linux and Windows are the first tier (docs/design/platforms.md): the
  # programs the job above built for Windows run on Windows itself, each held
  # to the output and status its fixture expects.
  windows:
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      # Git on a Windows runner checks text out with `\r\n` line endings,
      # which Bash cannot run a script with.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # The job runs no git command, so the token is not left behind.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the Windows programs
        uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: windows-programs

      - name: Run the Windows programs
        shell: bash
        run: dev/bin/check-programs windows-programs
