name: CI

# A pull request is where these checks are wanted, so they run there as well as
# in the merge queue. `workflow_dispatch` allows a re-run against any branch
# without opening a pull request.
#
# The push to main is what makes the caches below useful. GitHub lets a pull
# request read caches saved on its own branch or on the default branch, and on
# no other, so while CI ran only on pull requests every one of them started
# cold. A run on main saves a cache every pull request can restore.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # `.github/scripts/ci-suites` lists a pull request's changed files.
  pull-requests: read

# Superseded pull request runs are cancelled; a merge queue run is not, since
# the queue is waiting on its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      grammar: ${{ steps.suites.outputs.grammar }}
      ambiguity-tools: ${{ steps.suites.outputs.ambiguity-tools }}
      highlighting: ${{ steps.suites.outputs.highlighting }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PRs select the slower suites by changed files; main and the merge
      # queue run everything. Generator tests always run in highlighting.
      - name: Decide which suites to run
        id: suites
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-suites

      - name: Select parallel checks
        id: matrix
        env:
          GRAMMAR: ${{ steps.suites.outputs.grammar }}
          AMBIGUITY_TOOLS: ${{ steps.suites.outputs.ambiguity-tools }}
        run: |
          matrix=$(jq -cn --arg grammar "$GRAMMAR" --arg tools "$AMBIGUITY_TOOLS" '
            {suite: (["compiler", "highlighting"]
              + (if $grammar == "true" then ["grammar"] else [] end)
              + (if $tools == "true" then ["ambiguity-tools"] else [] end))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each suite owns its checkout and Dune build directory. A failing suite
  # does not cancel the others, so one run reports every failure. Windows
  # and macOS run the same suites below, but for highlighting's Neovim and
  # Typst consumers, in one job each.
  linux-native:
    needs: suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.suites.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci
        with:
          grammar-dependencies: ${{ matrix.suite == 'compiler' || matrix.suite == 'highlighting' }}

      # Preserve the full build and generated-file freshness check.
      - name: Build
        if: matrix.suite == 'compiler'
        run: pixi run just rebuild

      # No hand-written OCaml nests past five levels, and code at five is
      # warned about (`just check-nesting`). It parses the sources, so it
      # needs the toolchain this suite has just built with.
      - name: Check nesting
        if: matrix.suite == 'compiler'
        run: pixi run just check-nesting

      - name: Compiler tests
        if: matrix.suite == 'compiler'
        run: pixi run just test-compiler

      - name: Grammar generator tests
        if: matrix.suite == 'highlighting' && needs.suites.outputs.highlighting != 'true'
        run: pixi run just test-grammar-generation

      - name: Install Neovim and Typst
        if: matrix.suite == 'highlighting' && needs.suites.outputs.highlighting == 'true'
        run: .github/scripts/install-highlighting-consumers

      - name: Grammar generator and highlighting tests
        if: matrix.suite == 'highlighting' && needs.suites.outputs.highlighting == 'true'
        env:
          ZANE_REQUIRE_HIGHLIGHTING_TOOLS: '1'
        run: pixi run just test-highlighting

      - name: Grammar ambiguity tests
        if: matrix.suite == 'grammar'
        run: pixi run just test-grammar

      - name: Ambiguity tool tests
        if: matrix.suite == 'ambiguity-tools'
        run: pixi run just test-ambiguity-tools

  # Build the Windows programs on Linux, as the released Linux toolchain
  # builds them, independently: Windows execution need not wait for Linux's
  # grammar, highlighting or compiler tests.
  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci

      - name: Build the Windows programs
        run: pixi run dev/bin/cross-programs x86_64-windows-gnu windows-programs

      - name: Keep the Windows programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-programs
          path: windows-programs
          if-no-files-found: error

  # Aggregate the Linux checks. always() makes a failed or skipped
  # prerequisite fail this gate instead of silently skipping it.
  linux-checks:
    needs: [suites, linux-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  # Every hand-written source file stays under 2,000 lines, with a warning
  # past 1,500 (`.github/scripts/file-sizes`). It needs nothing but git, so it
  # runs on its own and answers in seconds.
  file-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file sizes
        run: .github/scripts/file-sizes

  # The programs windows-build made run on Windows itself, each held to the
  # output and status its fixture expects (docs/design/platforms.md).
  windows-tests:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      # Git on a Windows runner checks text out with `\r\n` line endings,
      # which Bash cannot run a script with.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      # The job runs no git command, so the token is not left behind.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Windows programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-programs
          path: windows-programs

      - name: Run the Windows programs
        shell: bash
        run: dev/bin/check-programs windows-programs

  # The compiler's own suites on Windows itself: zanec built natively from
  # the same pixi environment as Linux's, then what `just test` runs, held to
  # the triple a build without `--target` is for, and its image format and C
  # library, as on every system (docs/design/platforms.md).
  windows-native:
    needs: suites
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    # Dune's shared cache, kept between runs, so what a commit leaves
    # unchanged is not built again. Rules with actions of their own, the
    # tests among them, still run every time.
    env:
      DUNE_CACHE: enabled-except-user-rules
      DUNE_CACHE_ROOT: ${{ github.workspace }}/.dune-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci
        with:
          grammar-dependencies: true

      - name: Restore dune's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DUNE_CACHE_ROOT }}
          key: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-${{ github.sha }}
          restore-keys: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-

      - name: Compiler tests
        run: pixi run just test-compiler

      # The rest of `just test`, chosen as Linux's suites are.
      - name: Grammar generator tests
        if: ${{ !cancelled() }}
        run: pixi run just test-grammar-generation

      - name: Grammar ambiguity tests
        if: ${{ !cancelled() && needs.suites.outputs.grammar == 'true' }}
        run: pixi run just test-grammar

      - name: Ambiguity tool tests
        if: ${{ !cancelled() && needs.suites.outputs.ambiguity-tools == 'true' }}
        run: pixi run just test-ambiguity-tools

      # Kept whether or not the tests passed: what was built is the same.
      - name: Save dune's cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DUNE_CACHE_ROOT }}
          key: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-${{ github.sha }}

  # Aggregate the Windows checks with the same success rule as Linux.
  windows-checks:
    needs: [windows-build, windows-tests, windows-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  # macOS is the lower tier (docs/design/platforms.md), with its own gate,
  # but its suites run the same way: zanec built natively from the pixi
  # environment, then what `just test` runs. Apple Silicon runs for every
  # pull request; Intel, whose runners are the slowest, joins on main, in
  # the merge queue and when started by hand.
  macos-native:
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'pull_request'
            && '[{"arch":"aarch64","runner":"macos-latest"}]'
            || '[{"arch":"aarch64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]'
          ) }}
    name: macos-native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Dune's shared cache, as on Windows above.
    env:
      DUNE_CACHE: enabled-except-user-rules
      DUNE_CACHE_ROOT: ${{ github.workspace }}/.dune-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci
        with:
          grammar-dependencies: true

      - name: Restore dune's cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DUNE_CACHE_ROOT }}
          key: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-${{ github.sha }}
          restore-keys: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-

      - name: Compiler tests
        run: pixi run just test-compiler

      # The rest of `just test`, chosen as Linux's suites are.
      - name: Grammar generator tests
        if: ${{ !cancelled() }}
        run: pixi run just test-grammar-generation

      - name: Grammar ambiguity tests
        if: ${{ !cancelled() && needs.suites.outputs.grammar == 'true' }}
        run: pixi run just test-grammar

      - name: Ambiguity tool tests
        if: ${{ !cancelled() && needs.suites.outputs.ambiguity-tools == 'true' }}
        run: pixi run just test-ambiguity-tools

      # Kept whether or not the tests passed: what was built is the same.
      - name: Save dune's cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DUNE_CACHE_ROOT }}
          key: dune-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock', 'dev/setup/bootstrap-toolchain') }}-${{ github.sha }}

  # The programs for macOS, built on Linux as for Windows above, for each
  # architecture macos-native runs on. Each set travels as a tarball, since
  # an artifact keeps no file's mode and a macOS program runs only with its
  # own.
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        arch: >-
          ${{ fromJSON(
            github.event_name == 'pull_request'
            && '["aarch64"]'
            || '["aarch64","x86_64"]'
          ) }}
    name: macos-build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci

      - name: Build the macOS programs
        run: |
          pixi run dev/bin/cross-programs "${{ matrix.arch }}-macos" macos-programs
          tar -czf macos-programs.tar.gz macos-programs

      - name: Keep the macOS programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-programs-${{ matrix.arch }}
          path: macos-programs.tar.gz
          if-no-files-found: error

  # The programs macos-build made run on macOS itself, as Windows' run on
  # Windows.
  macos-tests:
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'pull_request'
            && '[{"arch":"aarch64","runner":"macos-latest"}]'
            || '[{"arch":"aarch64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]'
          ) }}
    name: macos-tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # The job runs no git command, so the token is not left behind.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the macOS programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-programs-${{ matrix.arch }}

      - name: Run the macOS programs
        run: |
          tar -xzf macos-programs.tar.gz
          dev/bin/check-programs macos-programs

  # Aggregate the macOS checks with the same success rule as Linux.
  macos-checks:
    needs: [macos-build, macos-tests, macos-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
