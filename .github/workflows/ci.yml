name: CI

# A pull request is where these checks are wanted, so they run there as well as
# in the merge queue. `workflow_dispatch` allows a re-run against any branch
# without opening a pull request.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; a merge queue run is not, since
# the queue is waiting on its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install devbox + Nix + devbox.json packages
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Sanity check
        run: devbox list

      # The init hook bootstraps the opam switch, but doing it as its own step
      # keeps a toolchain failure from being reported as a build failure.
      #
      # Every command below is a single word followed by plain arguments:
      # `devbox run` quotes each argument and `eval`s the result, so a shell
      # snippet passed this way would be mangled rather than run.
      - name: Install OCaml dependencies
        run: devbox run -- dev/bin/bootstrap-toolchain

      - name: Build
        run: devbox run -- just rebuild

      # Covers the parser acceptance tests, the grammar ambiguity checks, the
      # search engine's own tests, and the span expectation in test/. The recipe
      # fails loudly when Menhir is missing rather than reporting a green run
      # that skipped them.
      - name: Parser and ambiguity tests
        run: devbox run -- just test

      # Temporary full-grammar proof probe for the draft ambiguity PR. Keep the
      # engine under its memory budget and an outer process deadline; code 3 is
      # an inconclusive proof result, while code 1 is a concrete ambiguity.
      # The friendly profile CLI requires room for EOF, so use its engine entry
      # point to exercise the requested zero-token proof/candidate check bound.
      - name: Ambiguity proof probe (temporary)
        timeout-minutes: 7
        shell: bash
        env:
          AMBIGUITY_MEMORY_MB: "6144"
        run: |
          set -euo pipefail
          report=reports/ambiguity/actions/proof-probe.log
          mkdir -p "$(dirname "$report")"
          {
            echo "Head SHA: $GITHUB_SHA"
            echo "Resource limits: AMBIGUITY_MEMORY_MB=6144; engine timeout=330s; outer timeout=6m; step timeout=7m"
            echo "Command: timeout --signal=TERM --kill-after=10s 6m devbox run -- dev/bin/ambiguity __engine --max-tokens 0 --min-tokens 0 --timeout 330 --max-witnesses 1 --prove 1 --prove-cegar 3 --prove-refine 4"
            echo
          } > "$report"

          set +e
          timeout --signal=TERM --kill-after=10s 6m devbox run -- \
            dev/bin/ambiguity __engine --max-tokens 0 --min-tokens 0 \
            --timeout 330 --max-witnesses 1 --prove 1 \
            --prove-cegar 3 --prove-refine 4 \
            >> "$report" 2>&1
          probe_status=$?
          set -e

          case "$probe_status" in
            0) verdict="PROVEN" ;;
            1) verdict="CONCRETE AMBIGUITY" ;;
            3) verdict="NOT PROVEN" ;;
            124|137) verdict="TIMEOUT" ;;
            *) verdict="PROBE FAILED" ;;
          esac
          echo "Verdict: $verdict (exit $probe_status)" >> "$report"
          cat "$report"

          case "$probe_status" in
            0|3) exit 0 ;;
            1)
              echo "The proof probe found a concrete ambiguity; see the report above."
              exit 1
              ;;
            *)
              echo "The proof probe did not complete successfully; see the report above."
              exit "$probe_status"
              ;;
          esac

      - name: Upload ambiguity proof probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ambiguity-proof-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ambiguity/actions/proof-probe.log
          if-no-files-found: warn
          retention-days: 30

      # `just syntax-experiment-test` is deliberately absent. Its transforms
      # anchor on grammar text that has since moved, so it fails on `main`
      # today (one failure, three errors) independently of any pull request.
      # Add the step back once the anchors track the grammar again.
