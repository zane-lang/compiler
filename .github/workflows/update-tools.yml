# Dependabot updates actions; this covers the pixi environment and the pins
# Dependabot cannot read.
name: Update development tools
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-development-tools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Requires Settings > Actions > General > Allow GitHub Actions to create
    # and approve pull requests. All writes go to the automation branch.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Refresh upstream toolchain pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-toolchains.py
      # The newest packages pixi.toml's version ranges allow, on every platform.
      - name: Refresh the pixi lockfile
        run: pixi update
      - name: Propose tool updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-development-tools
          commit-message: 'chore: update development tools'
          title: 'chore: update development tools'
          body: |
            Refresh the development toolchain: pixi.lock and the pinned tools.
            Review the version changes and run CI before merging.
            Dependabot maintains GitHub Action pins separately.
            This workflow uses GITHUB_TOKEN: a maintainer must trigger CI for
            this PR, because token-created PRs do not start other workflows.
          add-paths: |
            pixi.lock
            dev/toolchains/zig-*.json
            dev/setup/bootstrap-toolchain
            formal/lean-toolchain
