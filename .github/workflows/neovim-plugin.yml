name: Neovim plugin

# Publishes editors/neovim, with the generated grammar it builds the parser
# from, to the standalone plugin repository TheLazyCat00/zane-nvim, so that
# plugin managers can install it by name. That repository is only ever written
# here: each commit there names the commit of this repository it came from.
on:
  push:
    branches: [main]
    paths:
      - editors/neovim/**
      - editors/tree-sitter-zane/grammar.js
      - editors/tree-sitter-zane/tree-sitter.json
      - editors/tree-sitter-zane/queries/**
      - .github/scripts/assemble-neovim-plugin
      - .github/workflows/neovim-plugin.yml
  workflow_dispatch:

# This repository is only read. Writing to the plugin repository uses its own
# deploy key, so this token needs nothing more.
permissions:
  contents: read

# Publishes are applied in order and never cancelled, so the newest commit's
# tree is the one left in the plugin repository.
concurrency:
  group: neovim-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: compiler

      # A deploy key with write access to the plugin repository only; its
      # private half is this repository's ZANE_NVIM_DEPLOY_KEY secret.
      - name: Checkout the plugin repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheLazyCat00/zane-nvim
          ssh-key: ${{ secrets.ZANE_NVIM_DEPLOY_KEY }}
          path: zane-nvim

      - name: Assemble the plugin
        run: compiler/.github/scripts/assemble-neovim-plugin zane-nvim

      - name: Publish
        working-directory: zane-nvim
        env:
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "The plugin repository already matches $SOURCE."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Sync from $SOURCE"
          git push origin HEAD
