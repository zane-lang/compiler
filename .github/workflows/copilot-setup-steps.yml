name: "Copilot Setup Steps"

on:
  workflow_dispatch:

# The same toolchain CI builds with (.github/workflows/ci.yml): the pixi
# environment (pixi.toml), with LLVM 21 for codegen's bindings, and the opam
# switch with dune, menhir, sedlex, uucp and uuseg. Without the opam switch
# the environment cannot build.
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vendor/coda, which lib/coda/ builds.
          submodules: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-ci
