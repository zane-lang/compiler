name: "Copilot Setup Steps"

on:
  workflow_dispatch:

# The same toolchain CI builds with (.github/workflows/ci.yml): devbox's
# packages, LLVM 19 for codegen's bindings, and the opam switch with dune,
# menhir and sedlex. Without the last two the environment cannot build.
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install devbox + Nix + devbox.json packages
        uses: jetify-com/devbox-install-action@v0.15.0

      - name: Sanity check
        run: devbox list

      - name: Install LLVM 19
        run: sudo apt-get update && sudo apt-get install -y llvm-19-dev libzstd-dev

      - name: Install OCaml dependencies
        run: devbox run -- dev/setup/bootstrap-toolchain
