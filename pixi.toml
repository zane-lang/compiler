# Toolchain spike: one conda-forge environment for Linux, macOS and Windows.
# Exploratory; see .github/workflows/toolchain-spike.yml. LLVM is 21 because
# conda-forge's macOS OCaml requires clang, lld and llvm-tools >= 21.

[workspace]
name = "zane-compiler"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
ocaml = "5.5.1.*"
opam = "*"
c-compiler = "*"
cxx-compiler = "*"
llvmdev = "21.1.8.*"
clangdev = "21.1.8.*"
lld = "21.1.8.*"
cmake = "*"
ninja = "*"
make = "*"
pkg-config = "*"
zstd = "*"
zlib = "*"
zig = "0.17.0.*"
just = "*"
python = "3.13.*"
nodejs = "*"

[target.unix.dependencies]
m4 = "*"

# glibc 2.34 has dlopen in libc itself, as the runtime's tests assume.
[target.linux-64.dependencies]
sysroot_linux-64 = "2.34.*"

# The MSVC build of OCaml, which matches how conda-forge builds LLVM on
# Windows; the gcc (MinGW) build would not link LLVM's C++ libraries.
[target.win-64.dependencies]
ocaml = { version = "5.5.1.*", build = "vs2022*" }
